[workspace]
resolver = "2"
members = ["crates/axilog-core", "crates/axilog-schema", "crates/axilog-api", "crates/axilog-ei", "crates/axilog-html", "crates/axilog-cli", "crates/axilog-node", "crates/axilog-py"]

[workspace.package]
version = "1.11.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
flate2 = "1"
clap = { version = "4", features = ["derive"] }

# Dev builds embed full debuginfo by default, which pushed target/ to 160G.
# line-tables-only keeps file/line in backtraces and panics; it drops variable
# and type info, so full gdb/lldb inspection needs a `debug = true` override.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

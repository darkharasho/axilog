[workspace]
resolver = "2"
members = ["crates/axilog-core", "crates/axilog-schema", "crates/axilog-ei", "crates/axilog-html", "crates/axilog-cli", "crates/axilog-node", "crates/axilog-py"]

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.74"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
flate2 = "1"
clap = { version = "4", features = ["derive"] }

[package]
name = "axilog-py"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The Python import name must match the `#[pymodule]` function name in
# src/lib.rs ("axilog"), independent of the crate/package name
# ("axilog-py") used for `cargo`/crates.io.
name = "axilog"
crate-type = ["cdylib"]

[dependencies]
axilog-core = { path = "../axilog-core" }
axilog-schema = { path = "../axilog-schema" }
axilog-ei = { path = "../axilog-ei" }
serde_json.workspace = true

# PyO3 0.29 is the current stable major on crates.io as of 2026-08-08
# (0.29.2). Two serde<->Python bridges were compared for that major:
#   - pythonize 0.29.0 depends on `pyo3 = "^0.29"` -- versioned in
#     lockstep with each PyO3 minor/major release, so its Cargo.toml
#     makes the "supports the PyO3 major we're on" contract explicit
#     and machine-checked.
#   - serde-pyobject 0.8.0 depends on `pyo3 = ">=0.27.0"` -- an open
#     floor, not tied to a specific PyO3 release, so nothing on
#     crates.io promises it tracks 0.29 (or a future 0.30) going
#     forward.
# pythonize is the pick: same maintenance model PyO3 itself uses
# (maintained by a PyO3 core contributor, released same-day as PyO3
# minors), and it round-trips `serde_json::Value` -- the same type
# `axilog-schema::Report`/`axilog-ei::to_ei_json` already serialize to
# for the Node SDK (crates/axilog-node) -- into Python dicts/lists with
# no extra glue.
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
pythonize = "0.29"

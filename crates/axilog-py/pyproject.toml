[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "axilog"
version = "1.6.2"
description = "Python bindings (PyO3) for axilog's Rust GW2 arcdps WvW parsing core"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
# The compiled extension module (see src/lib.rs's `#[pymodule] fn axilog`)
# is the whole package -- no separate Python source tree.
module-name = "axilog"
features = ["pyo3/extension-module"]

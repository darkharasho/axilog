name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build+test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build workspace
        run: cargo build --workspace --target ${{ matrix.target }}

      # Golden/calibration tests run for real in CI against the committed,
      # PII-safe fixture (fixtures/wvw-small.anon.zevtc — see Task 5, M2's
      # anonymize subcommand). The real raw .zevtc (fixtures/local/, PII) is
      # gitignored and never present here; the handful of tests that also
      # optionally re-check against it print a skip message in that case.
      - name: Test workspace
        run: cargo test --workspace

  # aarch64-unknown-linux-gnu is a build-only cross-target follow-up: there
  # is no hosted GitHub Actions runner for that target today, so it is not
  # included in the matrix above. Revisit with cross/qemu if native ARM
  # Linux coverage becomes necessary.

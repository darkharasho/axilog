name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (e.g. new commits pushed to an open PR, or a fast-follow
# push to main) auto-cancel their still-running predecessor rather than
# competing with it for the shared GitHub-hosted runner pool -- macos
# runners in particular are frequently backlogged, and letting stale runs
# pile up there starves the run that actually matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build+test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # x86_64-apple-darwin is cross-compiled on the same macos-latest
          # (Apple Silicon / aarch64 host) runner as the leg above, rather
          # than on a native Intel (macos-13) runner. GitHub is retiring
          # macos-13 and its runner pool has been severely backlogged, which
          # left this target's jobs stuck queued indefinitely. Apple's
          # toolchain (clang/ld64) cross-links x86_64-apple-darwin cleanly
          # from an arm64 host once the target is installed via rustup (see
          # `targets: ${{ matrix.target }}` below, which resolves to
          # `x86_64-apple-darwin` for this specific matrix entry -- the
          # toolchain step always keeps the host's native target available
          # in addition to whatever `matrix.target` adds, so no separate
          # "install both" step is needed). `cargo build --target
          # x86_64-apple-darwin` below then produces a real x86_64 Mach-O
          # binary, just built on arm64 hardware instead of x86_64 hardware.
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # crates/axilog-py (M6) is now an unconditional workspace member, so
      # `cargo build --workspace`/`cargo test --workspace` below compile it
      # on every leg. Setup-python runs before those steps, on every leg,
      # as cheap insurance -- researched directly against pyo3-build-config
      # 0.29.2 source (the crate's build-script dependency that decides
      # whether/how to link libpython): this crate's `abi3-py39` +
      # `extension-module` feature combo lets `make_interpreter_config`
      # fall back to a Python-free default stable-ABI config on every OS
      # (Windows never needs a lib dir under `raw-dylib`;
      # `is_linking_libpython_for_target` is false on Unix once
      # `extension-module` is set; abi3 skips the per-interpreter version
      # query everywhere), so a missing interpreter does NOT currently fail
      # `cargo build --workspace` on win/mac/linux -- it only downgrades to
      # a `cargo:warning`. That fallback is one pyo3/feature change away
      # from becoming a hard requirement (Windows in particular still
      # unconditionally reports `is_linking_libpython_for_target == true`
      # today), and the maturin steps further down need a real interpreter
      # regardless, so installing Python up front is strictly safer than
      # relying on runner images to happen to have one on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crates/axilog-py/pyproject.toml

      # Version single-source check (M8 Task 2): fails fast, before any
      # build minutes are spent, if the workspace Cargo.toml version and its
      # hand-duplicated copies (Node SDK package.json + its napi-rs platform
      # package dirs, Python SDK pyproject.toml) have drifted apart.
      # ubuntu-only: the check is platform-agnostic (pure text parsing, no
      # compiled artifacts), so running it on every OS in the matrix would
      # just repeat the same file reads three times over.
      - name: Check version sync (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: scripts/check-versions.sh

      - name: Build workspace
        run: cargo build --workspace --target ${{ matrix.target }}

      # Golden/calibration tests run for real in CI against the committed,
      # PII-safe fixture (fixtures/wvw-small.anon.zevtc — see Task 5, M2's
      # anonymize subcommand). The real raw .zevtc (fixtures/local/, PII) is
      # gitignored and never present here; the handful of tests that also
      # optionally re-check against it print a skip message in that case.
      - name: Test workspace
        run: cargo test --workspace

      # MPERF Task 1: criterion bench harness (crates/axilog-cli/benches/
      # pipeline.rs) over the committed fixture -- see docs/BENCHMARKS.md
      # for the baseline numbers and methodology. ubuntu-only, same
      # reasoning as the version-sync check above: the harness itself has
      # no OS-specific branches, so building/smoke-running it three times
      # would just repeat the same work. Two steps, deliberately not one
      # hard-timing pass/fail gate (CI runner timing is too noisy for
      # that): (1) `--no-run` builds every bench target, catching bench-code
      # rot (e.g. a `build_report` signature change breaking the harness)
      # as a compile error; (2) `-- --test` is criterion's built-in "run
      # once, skip statistical sampling" mode -- it exercises the harness
      # end to end (including the env-gated `AXILOG_BENCH_LOG` real-log arm,
      # which skips cleanly since that env var is never set here) without
      # spending CI minutes on full sampling.
      - name: Build benches (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench -p axilog-cli --no-run

      - name: Bench smoke - fixture, single pass (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench -p axilog-cli --bench pipeline -- --test

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/axilog-node/package-lock.json

      # Node SDK (crates/axilog-node, M5): the napi-rs addon is built on every
      # platform in this matrix so a platform-specific build break is still
      # caught immediately, but its `npm test` (node --test) only runs here,
      # on ubuntu. Why: (1) the suite's dual-path parity test shells out to
      # the CLI binary built just below and resolves fixtures via repo-root-
      # relative paths — exercising that plumbing on Windows/macOS as well
      # would mostly multiply CI time, not coverage; (2) the addon links the
      # same platform-agnostic axilog-core pipeline everywhere, so the test
      # bodies (JSON/struct field assertions) have no OS-specific branches
      # to catch. A green build on Windows/macOS is the signal that matters
      # there.
      - name: Build CLI (Node SDK parity test dependency)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p axilog-cli

      - name: Node SDK - install
        working-directory: crates/axilog-node
        run: npm ci

      - name: Node SDK - build addon
        working-directory: crates/axilog-node
        run: npm run build

      # MSMALL item 7: `npm run build` REGENERATES index.d.ts (napi's dts
      # generator, then scripts/patch-dts.mjs). Nothing downstream compared
      # the result against the committed file, so a napi-cli release that
      # changed the generated shape -- e.g. by dropping the doc comments
      # propagated from the Rust `///`s -- would have landed silently and
      # left the repo's copy stale.
      #
      # @napi-rs/cli is exact-pinned (3.8.2 in both package.json and
      # package-lock.json), so this should never fire through the normal
      # path; it fires when someone bumps the CLI, hand-edits the spec, or
      # deletes the lockfile. That is exactly when a human needs to look at
      # the diff, so failing loudly beats a stale committed file.
      #
      # If this fails legitimately (an intended napi bump), commit the
      # regenerated index.d.ts in the same change as the bump.
      - name: Node SDK - index.d.ts is regen-clean
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/axilog-node
        run: |
          if ! git diff --exit-code -- index.d.ts; then
            echo "::error::crates/axilog-node/index.d.ts differs from the committed copy after 'npm run build'."
            echo "The generated .d.ts has drifted (most likely a @napi-rs/cli version change)."
            echo "Review the diff above and commit the regenerated file if the change is intended."
            exit 1
          fi

      - name: Node SDK - test (linux only, see comment above)
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/axilog-node
        run: npm test

      # Python SDK (crates/axilog-py, M6): built on every platform in this
      # matrix (maturin, extension-module cdylib over the same core the
      # CLI/Node SDK use) so a platform-specific build break is caught
      # immediately, mirroring the Node SDK's approach above. Its test
      # suite (stdlib unittest, incl. a CLI-parity check against the
      # `target/debug/axilog` built above) only runs here, on ubuntu, for
      # the same reasons `npm test` is linux-only: the CLI-parity plumbing
      # is exercised once, and the test bodies have no OS-specific branches
      # for win/mac to catch that a clean `maturin build` wouldn't already
      # catch.
      - name: Python SDK - venv + develop + test (linux only, see comment above)
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/axilog-py
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin
          .venv/bin/maturin develop --release
          .venv/bin/python -m unittest discover -s tests

      # win/mac: build only (no venv install / test run — see comment
      # above), same shape as the Node addon build above.
      - name: Python SDK - install maturin + build wheel (win/mac, build only — see comment above)
        if: matrix.os != 'ubuntu-latest'
        working-directory: crates/axilog-py
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release

  # aarch64-unknown-linux-gnu is a build-only cross-target follow-up: there
  # is no hosted GitHub Actions runner for that target today, so it is not
  # included in the matrix above. Revisit with cross/qemu if native ARM
  # Linux coverage becomes necessary.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs (e.g. new commits pushed to an open PR, or a fast-follow
# push to main) auto-cancel their still-running predecessor rather than
# competing with it for the shared GitHub-hosted runner pool -- macos
# runners in particular are frequently backlogged, and letting stale runs
# pile up there starves the run that actually matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Version single-source check (M8 Task 2): the workspace Cargo.toml version
  # and every place it is duplicated by hand (Node SDK package.json, its
  # napi-rs platform package dirs, the optionalDependencies pins,
  # package-lock.json, the Python SDK's pyproject.toml, and index.js's
  # generated version literals) must agree. See scripts/check-versions.sh.
  #
  # This is a STANDALONE JOB rather than a step inside build-test, and that
  # is the entire point of it being here. It used to be the ubuntu leg's
  # first step, on the reasoning that it should "fail fast, before any build
  # minutes are spent". But on `main` it fails BY DESIGN for the whole window
  # between `chore: bump version to X` and release.yml's post-publish
  # lockfile-refresh job: package-lock.json cannot name @axiapps platform
  # packages that npm has not published yet. As the leg's first step, that
  # expected-red gate skipped every step behind it on every release commit --
  # including the Node SDK's byte-identity guards, which is how the
  # parseFileEi baseline (crates/axilog-node/__test__/fixtures/) rotted
  # unnoticed from v1.8.0 through v1.10.2.
  #
  # A gate that is expected to be red must not sit in front of guards that
  # are expected to be green. Splitting it out keeps the check exactly as
  # strict, keeps its red X visible on its own, and stops it from deciding
  # whether anything else runs.
  #
  # ubuntu-only: the check is pure text parsing with no compiled artifacts,
  # so running it per-OS would just repeat the same file reads.
  version-sync:
    name: version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # check-versions.sh parses package.json/package-lock.json with `node`.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: scripts/check-versions.sh

  build-test:
    name: build+test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            debug: '2'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            # See the `env:` block below -- Windows builds without debuginfo.
            debug: none
          - os: macos-latest
            target: aarch64-apple-darwin
            debug: '2'
          # x86_64-apple-darwin is cross-compiled on the same macos-latest
          # (Apple Silicon / aarch64 host) runner as the leg above, rather
          # than on a native Intel (macos-13) runner. GitHub is retiring
          # macos-13 and its runner pool has been severely backlogged, which
          # left this target's jobs stuck queued indefinitely. Apple's
          # toolchain (clang/ld64) cross-links x86_64-apple-darwin cleanly
          # from an arm64 host once the target is installed via rustup (see
          # `targets: ${{ matrix.target }}` below, which resolves to
          # `x86_64-apple-darwin` for this specific matrix entry -- the
          # toolchain step always keeps the host's native target available
          # in addition to whatever `matrix.target` adds, so no separate
          # "install both" step is needed). `cargo build --target
          # x86_64-apple-darwin` below then produces a real x86_64 Mach-O
          # binary, just built on arm64 hardware instead of x86_64 hardware.
          - os: macos-latest
            target: x86_64-apple-darwin
            debug: '2'

    # Windows-only: build without debuginfo, so `link.exe` emits no .pdb.
    #
    # The Windows leg has failed intermittently for months -- across branches
    # and on main -- always the same way: `LINK : fatal error LNK1201: error
    # writing to program database ...\axilog.pdb`. It is not caused by any
    # one change; it is the debug build's PDB writes losing against the
    # hosted runner. LNK1201's own message lists the candidates (disk space,
    # path, privilege) and a Defender scan holding the file mid-write is a
    # fourth. Rather than guess between them, remove the write: with
    # `debug = 0` rustc stops passing `/DEBUG`, no PDB is opened at all, and
    # every one of those causes is moot. It also cuts link time and a large
    # amount of disk on the leg that has the least of both -- the debug
    # workspace is built TWICE here (`--target` below, then an untargeted
    # `cargo test`), so PDBs were being written for two full copies.
    #
    # The cost is Windows-only and confined to CI: a panicking test there
    # gets an unsymbolized backtrace. Linux and macOS keep `debug = 2`
    # (cargo's dev default, spelled explicitly so this reads as a per-OS
    # choice rather than a global downgrade), and they are where a failure
    # is diagnosed anyway. Both keys are set because `profile.test` inherits
    # `profile.dev` -- setting `dev` alone should suffice, but the test step
    # links far more binaries than the build step, so it is worth not
    # depending on that inheritance detail.
    #
    # The level is carried as a MATRIX KEY rather than computed here with
    # `${{ matrix.os == 'windows-latest' && '0' || '2' }}`, which is how
    # this was first written and why it silently did nothing. GitHub casts
    # a string operand to a number when it can, so `'0'` becomes `0` and is
    # FALSY -- the `&&` fell through to `'2'` and Windows kept full
    # debuginfo. The failing link line proved it, still carrying `/DEBUG`
    # and `/PDBALTPATH` after the "fix" had shipped. `none` (cargo's own
    # spelling for no debuginfo) would dodge that particular cast, but a
    # matrix key dodges the whole class of expression-truthiness bug and
    # reads as data instead of as a conditional.
    env:
      CARGO_PROFILE_DEV_DEBUG: ${{ matrix.debug }}
      CARGO_PROFILE_TEST_DEBUG: ${{ matrix.debug }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # crates/axilog-py (M6) is now an unconditional workspace member, so
      # `cargo build --workspace`/`cargo test --workspace` below compile it
      # on every leg. Setup-python runs before those steps, on every leg,
      # as cheap insurance -- researched directly against pyo3-build-config
      # 0.29.2 source (the crate's build-script dependency that decides
      # whether/how to link libpython): this crate's `abi3-py39` +
      # `extension-module` feature combo lets `make_interpreter_config`
      # fall back to a Python-free default stable-ABI config on every OS
      # (Windows never needs a lib dir under `raw-dylib`;
      # `is_linking_libpython_for_target` is false on Unix once
      # `extension-module` is set; abi3 skips the per-interpreter version
      # query everywhere), so a missing interpreter does NOT currently fail
      # `cargo build --workspace` on win/mac/linux -- it only downgrades to
      # a `cargo:warning`. That fallback is one pyo3/feature change away
      # from becoming a hard requirement (Windows in particular still
      # unconditionally reports `is_linking_libpython_for_target == true`
      # today), and the maturin steps further down need a real interpreter
      # regardless, so installing Python up front is strictly safer than
      # relying on runner images to happen to have one on PATH.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crates/axilog-py/pyproject.toml

      # (The version single-source check used to live here, as this leg's
      # first step. It is now the standalone `version-sync` job above -- see
      # that job's comment for why it must not gate anything.)

      - name: Build workspace
        run: cargo build --workspace --target ${{ matrix.target }}

      # Golden/calibration tests run for real in CI against the committed,
      # PII-safe fixture (fixtures/wvw-small.anon.zevtc — see Task 5, M2's
      # anonymize subcommand). The real raw .zevtc (fixtures/local/, PII) is
      # gitignored and never present here; the handful of tests that also
      # optionally re-check against it print a skip message in that case.
      - name: Test workspace
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/axilog-node/package-lock.json

      # Node SDK (crates/axilog-node, M5): the napi-rs addon is built on every
      # platform in this matrix so a platform-specific build break is still
      # caught immediately, but its `npm test` (node --test) only runs here,
      # on ubuntu. Why: (1) the suite's dual-path parity test shells out to
      # the CLI binary built just below and resolves fixtures via repo-root-
      # relative paths — exercising that plumbing on Windows/macOS as well
      # would mostly multiply CI time, not coverage; (2) the addon links the
      # same platform-agnostic axilog-core pipeline everywhere, so the test
      # bodies (JSON/struct field assertions) have no OS-specific branches
      # to catch. A green build on Windows/macOS is the signal that matters
      # there.
      - name: Build CLI (Node SDK parity test dependency)
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p axilog-cli

      # `npm ci` is the strict path and stays the default: it refuses to
      # install unless package.json and package-lock.json agree, which is
      # exactly the guard we want on ordinary commits.
      #
      # It is ALSO the second gate that is red by design on release commits,
      # for the same reason the version-sync job is. A bump rewrites
      # package.json's optionalDependencies to pin @axiapps platform packages
      # at the new version; the lock still names the previous one, because
      # the new one is not on the registry until npm-publish runs. `npm ci`
      # reports `Invalid: lock file's @axiapps/axilog-darwin-arm64@X-1 does
      # not satisfy @axiapps/axilog-darwin-arm64@X` and exits, taking the
      # addon build, the index.d.ts regen check and `npm test` with it. So
      # splitting out the version-sync job alone would not have made the Node
      # guards run -- this step would just have become the new blocker.
      #
      # `--omit=optional` does NOT help: npm validates the lock against every
      # declared dependency, optional ones included, before it decides what
      # to reify.
      #
      # The fallback is deliberately narrow. It fires only when
      # package-lock.json's own root version differs from package.json's --
      # i.e. only inside the bump-to-publish window. If the two versions
      # agree and `npm ci` still fails, that is a genuine lockfile problem
      # and this step fails, as before. `npm install --no-save
      # --omit=optional` then installs the one devDependency the SDK build
      # needs (@napi-rs/cli, exact-pinned), skips the unpublishable platform
      # packages, and leaves package-lock.json untouched -- so it cannot
      # launder a bad lock into a green run, and cannot produce the empty
      # `{"optional": true}` stubs that check-versions.sh exists to catch.
      #
      # The platform packages are not needed to test anyway: the addon is
      # built from source below, and index.js prefers the local
      # `axilog.<platform>.node` over the @axiapps package.
      - name: Node SDK - install
        working-directory: crates/axilog-node
        shell: bash
        run: |
          if npm ci; then
            exit 0
          fi
          PKG_VERSION="$(node -p "require('./package.json').version")"
          LOCK_VERSION="$(node -p "require('./package-lock.json').version")"
          if [ "$PKG_VERSION" = "$LOCK_VERSION" ]; then
            echo "::error::npm ci failed with package.json and package-lock.json both at $PKG_VERSION. That is a real lockfile problem, not the pre-publish version window -- not falling back."
            exit 1
          fi
          echo "::warning::package.json is at $PKG_VERSION but package-lock.json is at $LOCK_VERSION (the window between a version bump and npm-publish). Falling back to 'npm install --no-save --omit=optional' so the Node SDK guards still run; release.yml's lockfile-refresh job resyncs the lock after publish."
          npm install --no-save --omit=optional

      - name: Node SDK - build addon
        working-directory: crates/axilog-node
        run: npm run build

      # MSMALL item 7: `npm run build` REGENERATES index.d.ts (napi's dts
      # generator, then scripts/patch-dts.mjs). Nothing downstream compared
      # the result against the committed file, so a napi-cli release that
      # changed the generated shape -- e.g. by dropping the doc comments
      # propagated from the Rust `///`s -- would have landed silently and
      # left the repo's copy stale.
      #
      # @napi-rs/cli is exact-pinned (3.8.2 in both package.json and
      # package-lock.json), so this should never fire through the normal
      # path; it fires when someone bumps the CLI, hand-edits the spec, or
      # deletes the lockfile. That is exactly when a human needs to look at
      # the diff, so failing loudly beats a stale committed file.
      #
      # If this fails legitimately (an intended napi bump), commit the
      # regenerated index.d.ts in the same change as the bump.
      - name: Node SDK - index.d.ts is regen-clean
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/axilog-node
        run: |
          if ! git diff --exit-code -- index.d.ts; then
            echo "::error::crates/axilog-node/index.d.ts differs from the committed copy after 'npm run build'."
            echo "The generated .d.ts has drifted (most likely a @napi-rs/cli version change)."
            echo "Review the diff above and commit the regenerated file if the change is intended."
            exit 1
          fi

      - name: Node SDK - test (linux only, see comment above)
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/axilog-node
        run: npm test

      # Python SDK (crates/axilog-py, M6): built on every platform in this
      # matrix (maturin, extension-module cdylib over the same core the
      # CLI/Node SDK use) so a platform-specific build break is caught
      # immediately, mirroring the Node SDK's approach above. Its test
      # suite (stdlib unittest, incl. a CLI-parity check against the
      # `target/debug/axilog` built above) only runs here, on ubuntu, for
      # the same reasons `npm test` is linux-only: the CLI-parity plumbing
      # is exercised once, and the test bodies have no OS-specific branches
      # for win/mac to catch that a clean `maturin build` wouldn't already
      # catch.
      - name: Python SDK - venv + develop + test (linux only, see comment above)
        if: matrix.os == 'ubuntu-latest'
        working-directory: crates/axilog-py
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip maturin
          .venv/bin/maturin develop --release
          .venv/bin/python -m unittest discover -s tests

      # win/mac: build only (no venv install / test run — see comment
      # above), same shape as the Node addon build above.
      - name: Python SDK - install maturin + build wheel (win/mac, build only — see comment above)
        if: matrix.os != 'ubuntu-latest'
        working-directory: crates/axilog-py
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release

      # Benches run LAST, after the SDK suites. They used to sit between
      # `cargo test --workspace` and the Node SDK steps, which made a
      # bench-harness compile error -- something unrelated to any guard --
      # enough to skip the Node and Python SDK tests entirely. Nothing
      # below depends on them, so they belong at the end.
      #
      # MPERF Task 1: criterion bench harness (crates/axilog-cli/benches/
      # pipeline.rs) over the committed fixture -- see docs/BENCHMARKS.md
      # for the baseline numbers and methodology. ubuntu-only, same
      # reasoning as the SDK test steps above: the harness itself has
      # no OS-specific branches, so building/smoke-running it three times
      # would just repeat the same work. Two steps, deliberately not one
      # hard-timing pass/fail gate (CI runner timing is too noisy for
      # that): (1) `--no-run` builds every bench target, catching bench-code
      # rot (e.g. a `build_report` signature change breaking the harness)
      # as a compile error; (2) `-- --test` is criterion's built-in "run
      # once, skip statistical sampling" mode -- it exercises the harness
      # end to end (including the env-gated `AXILOG_BENCH_LOG` real-log arm,
      # which skips cleanly since that env var is never set here) without
      # spending CI minutes on full sampling.
      - name: Build benches (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench -p axilog-cli --no-run

      - name: Bench smoke - fixture, single pass (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench -p axilog-cli --bench pipeline -- --test

  # aarch64-unknown-linux-gnu is a build-only cross-target follow-up: there
  # is no hosted GitHub Actions runner for that target today, so it is not
  # included in the matrix above. Revisit with cross/qemu if native ARM
  # Linux coverage becomes necessary.

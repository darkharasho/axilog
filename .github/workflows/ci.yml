name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build+test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build workspace
        run: cargo build --workspace --target ${{ matrix.target }}

      # No local .zevtc fixture is present in CI (fixtures/local/ is
      # gitignored, PII), so the golden parity test and the repointed
      # fixture-based tests print a skip message and pass rather than run.
      - name: Test workspace
        run: cargo test --workspace

  # aarch64-unknown-linux-gnu is a build-only cross-target follow-up: there
  # is no hosted GitHub Actions runner for that target today, so it is not
  # included in the matrix above. Revisit with cross/qemu if native ARM
  # Linux coverage becomes necessary.
